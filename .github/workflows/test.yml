name: Test Suite

on:
  push:
    branches: [main, C-Engine-API]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.codacy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential

      - name: Build (debug)
        run: make debug -j$(nproc)

      - name: Run unit tests
        id: unit
        run: |
          OUTPUT=$(./bin/demi-engine-debug -ut 2>&1)
          echo "$OUTPUT"
          # Extract pass/fail from summary line: "Unit Tests: N passed / M"
          PASSED=$(echo "$OUTPUT" | grep -oP 'Unit Tests:\s+\K\d+(?= passed)')
          TOTAL=$(echo "$OUTPUT" | grep -oP 'Unit Tests:\s+\d+ passed / \K\d+')
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= test\(s\) failed)' || echo "0")
          echo "unit_passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "unit_total=${TOTAL:-0}" >> $GITHUB_OUTPUT
          echo "unit_failed=${FAILED:-0}" >> $GITHUB_OUTPUT
          # Exit non-zero if any failures
          if [ "${FAILED:-0}" -gt 0 ]; then exit 1; fi

      - name: Run assembly tests
        id: asm
        run: |
          OUTPUT=$(./bin/demi-engine-debug -atq 2>&1)
          echo "$OUTPUT"
          # Extract: "Total Tests: N (passed: P, failed: F, skipped: S)"
          TOTAL=$(echo "$OUTPUT" | grep -oP 'Total Tests:\s+\K\d+')
          PASSED=$(echo "$OUTPUT" | grep -oP 'passed:\s+\K\d+')
          FAILED=$(echo "$OUTPUT" | grep -oP 'failed:\s+\K\d+')
          echo "asm_total=${TOTAL:-0}" >> $GITHUB_OUTPUT
          echo "asm_passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "asm_failed=${FAILED:-0}" >> $GITHUB_OUTPUT
          # Exit non-zero if any failures
          if [ "${FAILED:-0}" -gt 0 ]; then exit 1; fi

      - name: Generate badge
        if: always()
        run: |
          python3 - "${{ steps.unit.outputs.unit_passed }}" \
                    "${{ steps.unit.outputs.unit_total }}" \
                    "${{ steps.unit.outputs.unit_failed }}" \
                    "${{ steps.asm.outputs.asm_passed }}" \
                    "${{ steps.asm.outputs.asm_total }}" \
                    "${{ steps.asm.outputs.asm_failed }}" << 'PYEOF'
          import sys

          up, ut, uf, ap, at, af = [int(x) for x in sys.argv[1:]]
          total_passed = up + ap
          total_all = ut + at
          total_failed = uf + af

          if total_failed > 0:
              color = "#e05d44"  # red
              label = "tests"
              message = f"{total_failed} failed"
          elif total_all == 0:
              color = "#9f9f9f"  # grey
              label = "tests"
              message = "no data"
          else:
              color = "#4c1"     # green
              label = "tests"
              message = f"{total_passed}/{total_all} passed"

          # Measure text widths (approximate: 7px per char for label, 6.2px for message)
          label_width = len(label) * 7 + 10
          message_width = len(message) * 6.2 + 10
          total_width = label_width + message_width

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{total_width}" height="20" role="img">
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="{total_width}" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="{label_width}" height="20" fill="#555"/>
              <rect x="{label_width}" width="{message_width}" height="20" fill="{color}"/>
              <rect width="{total_width}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
              <text x="{label_width/2}" y="14">{label}</text>
              <text x="{label_width + message_width/2}" y="14">{message}</text>
            </g>
          </svg>'''

          with open("badge.svg", "w") as f:
              f.write(svg)
          print(f"Badge generated: {total_passed}/{total_all} passed, {total_failed} failed")
          PYEOF

      - name: Upload badge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-badge
          path: badge.svg
          retention-days: 90
